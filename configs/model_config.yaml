# ClinicaGuard Model Configuration
model:
  random_state: 42
  test_size: 0.20
  cv_folds: 5

tabular_baseline:
  model_type: xgboost
  n_estimators: 150
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.85
  colsample_bytree: 0.85
  scale_pos_weight: 3.2

multimodal_model:
  model_type: xgboost
  n_estimators: 200
  max_depth: 5
  learning_rate: 0.04
  subsample: 0.85
  colsample_bytree: 0.80
  scale_pos_weight: 3.0
  knn_neighbors: 10
  cluster_count: 8

evidently:
  drift_share_threshold: 0.30
  confidence_level: 0.95
